name: gdal.art CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS arm64, current stable GDAL via Homebrew (SPEC 50)
  macos:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - name: System deps (GDAL + libffi)
        run: brew install gdal libffi
      - name: Install Arturo 0.10.0 (prebuilt)
        run: |
          curl -fsSL -o arturo.zip \
            "https://github.com/arturo-lang/arturo/releases/download/v0.10.0/arturo-0.10.0-macos-arm64.zip"
          echo "1f604b4068733f0c7cda549cccb125ed9aaf6209181276b20b848d77859a0347  arturo.zip" | shasum -a 256 -c -
          unzip -q arturo.zip -d arturo-bin
          chmod +x arturo-bin/arturo
          echo "$PWD/arturo-bin" >> "$GITHUB_PATH"
      - name: Build the FFI adapter
        run: make native
      - name: Generate bindings
        run: make generate
      - name: Determinism + ABI probe + golden
        run: make check
      - name: Test suite
        run: make test
      - name: Worked examples
        run: make examples
      - name: arturo-ffi adapter tests
        run: make -C arturo-ffi test
      - name: Coverage report
        run: make coverage

  # Linux x86_64, GDAL 3.8.5 — minimum supported / golden pin (SPEC 31, 50).
  linux-3-8:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - name: Full matrix in the OSGeo GDAL 3.8 container
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/osgeo/gdal:ubuntu-small-3.8.5 bash -c '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq build-essential git pkg-config libffi-dev \
              binutils libgtk-3-dev libmpfr-dev
            apt-get install -y -qq libwebkit2gtk-4.0-dev
            curl -fsSL -o arturo.zip \
              "https://github.com/arturo-lang/arturo/releases/download/v0.10.0/arturo-0.10.0-linux-amd64-legacy.zip"
            echo "9193b971a2ceceb06ad7aa36822c64989859d9bea4414f409a20d0333cc14dd5  arturo.zip" | sha256sum -c -
            unzip -q arturo.zip -d arturo-bin
            chmod +x arturo-bin/arturo
            export PATH="$PWD/arturo-bin:$PATH"
            make native
            make generate
            make check
            make test
            make examples
            make -C arturo-ffi test
            make coverage
          '

  # Linux x86_64, GDAL 3.10.1 via the OSGeo GHCR image (>= min 3.8).
  # The image has no git, so checkout runs on the runner and the repo is
  # mounted into a `docker run` for the whole matrix (SPEC 50).
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - name: Full matrix in the OSGeo GDAL container
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/osgeo/gdal:ubuntu-small-3.10.1 bash -c '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq build-essential git pkg-config libffi-dev \
              binutils libwebkit2gtk-4.1-dev libgtk-3-dev libmpfr-dev
            curl -fsSL -o arturo.zip \
              "https://github.com/arturo-lang/arturo/releases/download/v0.10.0/arturo-0.10.0-linux-amd64.zip"
            echo "764e484bf226ed14494b0e87601af4cd399da778d31ea059150bb07a621bb35d  arturo.zip" | sha256sum -c -
            unzip -q arturo.zip -d arturo-bin
            chmod +x arturo-bin/arturo
            export PATH="$PWD/arturo-bin:$PATH"
            make native
            make generate
            make check
            make test
            make examples
            make -C arturo-ffi test
            make coverage
          '
